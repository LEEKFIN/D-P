<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свадьба Дуулат & Перизат</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #2a1a2e 0%, #0e0810 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  /* Floating petals */
  .petal {
    position: fixed;
    width: 8px;
    height: 12px;
    background: rgba(212, 160, 180, 0.35);
    border-radius: 50% 0 50% 0;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ── SCENE ── */
  .scene {
    perspective: 1200px;
    width: 320px;
    height: 220px;
    cursor: pointer;
    position: relative;
  }

  /* ── ENVELOPE BODY ── */
  .envelope {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.05s;
  }
  .envelope:hover { transform: scale(1.03); }

  /* Back face */
  .env-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #c9a84c 0%, #f0d98a 40%, #c9a84c 100%);
    border-radius: 6px 6px 8px 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.4);
  }

  /* Bottom triangle */
  .env-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-bottom: 110px solid #b8922f;
    filter: drop-shadow(0 -4px 8px rgba(0,0,0,0.2));
  }

  /* Side triangles */
  .env-left {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-top: 110px solid transparent;
    border-bottom: 110px solid transparent;
    border-left: 160px solid #d4a84c;
  }
  .env-right {
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-top: 110px solid transparent;
    border-bottom: 110px solid transparent;
    border-right: 160px solid #c49a3c;
  }

  /* Wax seal */
  .seal {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 52px;
    background: radial-gradient(circle at 40% 35%, #8b1a2e, #5a0e1c);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 16px rgba(90,14,28,0.6), inset 0 1px 4px rgba(255,200,200,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    z-index: 10;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .scene:hover .seal { transform: translateX(-50%) scale(1.08); box-shadow: 0 6px 24px rgba(90,14,28,0.8); }

  /* Flap — rotates on click */
  .env-flap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 110px solid #e8c060;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    z-index: 20;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
  }
  .env-flap.open {
    transform: rotateX(180deg);
  }

  /* Click hint */
  .hint {
    position: absolute;
    bottom: -38px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(240,217,138,0.7);
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    white-space: nowrap;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

  /* ── CARD ── */
  .card-wrapper {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,5,14,0.0);
    pointer-events: none;
    z-index: 100;
  }
  .card-wrapper.visible {
    pointer-events: all;
  }

  .card {
    width: 340px;
    background: linear-gradient(160deg, #fdf8f0 0%, #f5ead8 100%);
    border-radius: 12px;
    padding: 36px 32px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,168,76,0.3);
    transform: translateY(60px) scale(0.85);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.06'%3E%3Cpath d='M30 0C13.4 0 0 13.4 0 30s13.4 30 30 30 30-13.4 30-30S46.6 0 30 0zm0 4c14.4 0 26 11.6 26 26S44.4 56 30 56 4 44.4 4 30 15.6 4 30 4z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
    pointer-events: none;
  }
  .card-wrapper.visible .card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  /* Gold divider */
  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin: 12px auto;
  }

  .card-top { font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.22em; color:#b8922f; text-transform:uppercase; margin-bottom:6px; }

  .names {
    font-family:'Playfair Display',serif;
    font-size:30px;
    color:#2a1a1a;
    line-height:1.2;
    margin: 4px 0 2px;
  }
  .names em { font-style:italic; color:#6b2d3e; }
  .ampersand { color:#c9a84c; font-size:36px; }

  .invite-text {
    font-family:'Cormorant Garamond',serif;
    font-size:14px;
    font-style:italic;
    color:#7a5a4a;
    margin: 10px 0;
    line-height:1.6;
  }

  /* Calendar */
  .calendar {
    margin: 18px auto 0;
    width: 220px;
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(107,45,62,0.1);
  }
  .cal-header {
    background: linear-gradient(135deg, #6b2d3e, #8b1a2e);
    color: #f0d98a;
    padding: 10px 16px;
    font-family:'Playfair Display',serif;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .cal-body {
    background: #fff;
    padding: 10px 12px 14px;
  }
  .cal-days-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 10px;
    color: #aaa;
    letter-spacing:0.05em;
    margin-bottom: 6px;
    font-family:'Cormorant Garamond',serif;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
  }
  .cal-grid span {
    padding: 4px 2px;
    font-size: 12px;
    font-family:'Cormorant Garamond',serif;
    color: #5a3a2a;
    border-radius: 4px;
  }
  .cal-grid span.empty { color: transparent; }
  .cal-grid span.highlight {
    background: linear-gradient(135deg, #6b2d3e, #8b1a2e);
    color: #f0d98a;
    font-weight: 600;
    font-size: 13px;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    box-shadow: 0 2px 10px rgba(107,45,62,0.4);
    animation: heartbeat 1.8s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100%{transform:scale(1)} 30%{transform:scale(1.12)} 60%{transform:scale(1.05)}
  }

  .venue {
    margin-top: 16px;
  }
  .venue-name {
    font-family:'Playfair Display',serif;
    font-size:20px;
    color:#6b2d3e;
    letter-spacing:0.06em;
  }
  .venue-label {
    font-family:'Cormorant Garamond',serif;
    font-size:11px;
    letter-spacing:0.2em;
    color:#b8922f;
    text-transform:uppercase;
    margin-top:2px;
  }

  .venue-address {
    font-family:'Cormorant Garamond',serif;
    font-size:11px;
    color:#9a7a6a;
    margin-top:4px;
    letter-spacing:0.05em;
  }
  .venue-map {
    display:inline-block;
    margin-top:6px;
    font-family:'Cormorant Garamond',serif;
    font-size:12px;
    color:#6b2d3e;
    text-decoration:none;
    border-bottom:1px solid rgba(107,45,62,0.3);
    transition:color 0.2s, border-color 0.2s;
  }
  .venue-map:hover { color:#c9a84c; border-color:rgba(201,168,76,0.5); }

  .close-btn {
    margin-top: 18px;
    background: none;
    border: 1px solid rgba(201,168,76,0.5);
    color: #b8922f;
    padding: 7px 22px;
    border-radius: 20px;
    font-family:'Cormorant Garamond',serif;
    font-size:12px;
    letter-spacing:0.15em;
    cursor:pointer;
    transition: background 0.2s, color 0.2s;
    text-transform:uppercase;
  }
  .close-btn:hover { background: rgba(201,168,76,0.12); }
</style>
</head>
<body>

<!-- Falling petals -->
<script>
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.style.cssText=`left:${Math.random()*100}vw;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*10}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
  }
</script>

<!-- Envelope -->
<div class="scene" id="scene" onclick="openEnvelope()">
  <div class="envelope" id="env">
    <div class="env-back"></div>
    <div class="env-left"></div>
    <div class="env-right"></div>
    <div class="env-bottom"></div>
    <div class="env-flap" id="flap"></div>
    <div class="seal">💍</div>
  </div>
  <div class="hint">Нажми, чтобы открыть</div>
</div>

<!-- Invitation card -->
<div class="card-wrapper" id="cardWrapper">
  <div class="card" id="card">
    <div class="card-top">Приглашение</div>
    <div class="divider"></div>

    <div class="names">
      <em>Дуулат</em>
      <div class="ampersand">&amp;</div>
      <em>Перизат</em>
    </div>

    <div class="divider"></div>
    <div class="invite-text">с радостью приглашают вас разделить<br>с ними счастье этого дня</div>

    <!-- August 2026 calendar -->
    <div class="calendar">
      <div class="cal-header">Август 2026</div>
      <div class="cal-body">
        <div class="cal-days-row">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="cal-grid">
          <!-- Aug 2026: starts on Saturday (index 5) -->
          <span class="empty"></span><span class="empty"></span><span class="empty"></span><span class="empty"></span><span class="empty"></span>
          <span>1</span><span>2</span>
          <span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
          <span>10</span><span>11</span><span>12</span><span>13</span><span>14</span>
          <span class="highlight">15</span>
          <span>16</span>
          <span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span>
          <span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span><span>30</span>
          <span>31</span>
        </div>
      </div>
    </div>

    <div class="venue">
      <div class="venue-label">Ресторан</div>
      <div class="venue-name">Palazzo</div>
      <div class="venue-address">ул. Сухэ-Батора, 3/2, Бишкек</div>
      <a class="venue-map" href="https://go.2gis.com/7WHGY" target="_blank">📍 Открыть на карте</a>
    </div>

    <button class="close-btn" onclick="closeCard()">Закрыть</button>
  </div>
</div>

<script>
  let opened = false;

  function openEnvelope() {
    if (opened) return;
    opened = true;

    // Open flap
    document.getElementById('flap').classList.add('open');

    // Show card after flap opens
    setTimeout(() => {
      const wrapper = document.getElementById('cardWrapper');
      wrapper.classList.add('visible');
    }, 500);
  }

  function closeCard() {
    const wrapper = document.getElementById('cardWrapper');
    wrapper.classList.remove('visible');
    setTimeout(() => {
      document.getElementById('flap').classList.remove('open');
      opened = false;
    }, 400);
  }
</script>
</body>
</html>
